name: Sync Blog Content

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4 Pillow google-analytics-data google-api-python-client google-auth

      - name: Sync blog content
        run: python scripts/sync_blog.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          RUN_REPORT_TAG_ID: ${{ secrets.RUN_REPORT_TAG_ID }}

      - name: Commit and Push
        run: |
          if git diff --quiet -- blog.html post sitemap.xml post-registry.json post-map.md log internal-8f2k1q; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.html post sitemap.xml post-registry.json post-map.md log internal-8f2k1q
          git commit -m "Sync blog content from feed"

          # Ensure push is based on latest remote state to avoid non-fast-forward failures.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}